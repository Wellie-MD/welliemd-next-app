name: Admin V2 Built-Asset Proof

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'release-identity.ts'
      - 'vite.config.ts'
      - 'package*.json'
      - '.github/workflows/runtime-v2-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  built-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build and verify immutable asset digest
        env:
          WELLIEMD_BUILD_COMMIT: ${{ github.sha }}
          WELLIEMD_BUILD_ID: github-${{ github.run_id }}.${{ github.run_attempt }}
        run: npm run test:release-identity
      - name: Exercise built identity over HTTP
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4173/release-identity.json > identity.json; then
              break
            fi
            sleep 1
          done
          test "$(jq -r .commit identity.json)" = "${GITHUB_SHA}"
          test "$(jq -r .runtime_contract_version identity.json)" = "2"
          test "$(jq -r .asset_digest identity.json)" != "unknown"
